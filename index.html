<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CTSC 极地破冰船 · Polar Icebreaker 3D</title>
  <style>
    :root {
      --paper: #f3f5f6;
      --paper-panel: rgba(244, 246, 248, 0.86);
      --ink: #151c24;
      --ink-muted: #4b5d70;
      --cobalt: #2f659c;
      --shadow-blue: #6283ab;
      --amber: #ee9126;
      --border: rgba(21, 28, 36, 0.22);
      --border-strong: rgba(21, 28, 36, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", "SF Pro Display", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
    }

    #scene-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Editorial Architectural HUD Layer */
    #hud-root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    #hud-root.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;
      background: var(--paper-panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid var(--border-strong);
      box-shadow: 3px 3px 0 rgba(98, 131, 171, 0.34);
    }

    /* Top-left Title & Telemetry Plate */
    .title-plate {
      position: absolute;
      top: 20px;
      left: 22px;
      padding: 12px 16px 11px;
      min-width: 236px;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }

    .vessel-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      padding: 2px 6px;
      background: var(--cobalt);
      color: #f4f6f8;
      border: 1px solid var(--ink);
    }

    .title-main {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: minmax(60px, auto) minmax(44px, auto) minmax(84px, auto);
      gap: 12px;
      padding-top: 7px;
      border-top: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .stat-value {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--ink);
    }

    .throttle-track {
      margin-top: 8px;
      height: 4px;
      width: 100%;
      background: rgba(21, 28, 36, 0.12);
      border: 1px solid rgba(21, 28, 36, 0.35);
      overflow: hidden;
    }

    .throttle-fill {
      height: 100%;
      width: 60%;
      background: var(--cobalt);
      transition: width 0.08s linear;
    }

    /* Top-right Minimal Action Controls */
    .top-actions {
      position: absolute;
      top: 20px;
      right: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-switch {
      pointer-events: auto;
      display: inline-flex;
      background: var(--paper-panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid var(--border-strong);
      box-shadow: 2px 2px 0 rgba(98, 131, 171, 0.32);
    }

    .lang-btn {
      appearance: none;
      background: transparent;
      border: none;
      border-right: 1px solid var(--border);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 7px 9px;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .lang-btn:last-child {
      border-right: none;
    }

    .lang-btn:hover {
      background: rgba(47, 101, 156, 0.14);
    }

    .lang-btn.active {
      background: var(--cobalt);
      color: var(--paper);
    }

    .icon-btn {
      pointer-events: auto;
      appearance: none;
      background: var(--paper-panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid var(--border-strong);
      box-shadow: 2px 2px 0 rgba(98, 131, 171, 0.32);
      color: var(--ink);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 7px 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background 0.14s ease, color 0.14s ease;
    }

    .icon-btn:hover {
      background: var(--ink);
      color: var(--paper);
      transform: translate(-1px, -1px);
    }

    .icon-btn kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      padding: 0 4px;
      border: 1px solid currentColor;
      opacity: 0.78;
    }

    /* Show HUD restore button when hidden */
    #btn-show-hud {
      position: fixed;
      top: 20px;
      right: 22px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 20;
    }

    #btn-show-hud.visible {
      opacity: 0.85;
      pointer-events: auto;
    }

    #btn-show-hud.visible:hover {
      opacity: 1;
    }

    /* Bottom-left Compact WASD Helm Control Pad */
    .helm-panel {
      position: absolute;
      bottom: 22px;
      left: 22px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wasd-grid {
      display: grid;
      grid-template-columns: repeat(3, 30px);
      grid-template-rows: repeat(2, 28px);
      gap: 4px;
    }

    .keycap {
      appearance: none;
      border: 1.5px solid var(--border-strong);
      background: #f8fafb;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 1.5px 1.5px 0 rgba(21, 28, 36, 0.28);
      transition: background 0.08s ease, color 0.08s ease, transform 0.08s ease;
    }

    .keycap.pressed,
    .keycap:active {
      background: var(--cobalt);
      color: #f4f6f8;
      transform: translate(1px, 1px);
      box-shadow: none;
    }

    .key-w { grid-column: 2; grid-row: 1; }
    .key-a { grid-column: 1; grid-row: 2; }
    .key-s { grid-column: 2; grid-row: 2; }
    .key-d { grid-column: 3; grid-row: 2; }

    .helm-hints {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--ink-muted);
      line-height: 1.35;
    }

    .helm-hints strong {
      color: var(--ink);
      font-weight: 700;
    }

    .space-btn {
      margin-top: 2px;
      padding: 3px 8px;
      width: fit-content;
      font-size: 10px;
      height: 22px;
    }

    /* Bottom-center Fixed Camera Lens Selector */
    .lens-dock {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .lens-desc {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--ink);
      background: rgba(243, 245, 246, 0.82);
      padding: 3px 10px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .lens-bar {
      display: flex;
      gap: 0;
      padding: 0;
    }

    .lens-btn {
      appearance: none;
      background: transparent;
      border: none;
      border-right: 1px solid var(--border);
      padding: 8px 13px;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .lens-btn:last-child {
      border-right: none;
    }

    .lens-btn:hover {
      background: rgba(47, 101, 156, 0.12);
    }

    .lens-btn.active {
      background: var(--ink);
      color: var(--paper);
    }

    .lens-key {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      width: 17px;
      height: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid currentColor;
      opacity: 0.8;
    }

    .lens-btn.active .lens-key {
      border-color: var(--amber);
      background: var(--amber);
      color: var(--ink);
      opacity: 1;
      font-weight: 700;
    }

    @media (max-width: 920px) {
      .helm-panel { display: none; }
      .lens-desc { display: none; }
      .lens-btn { padding: 7px 9px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <div id="hud-root">
    <!-- Top-left Vessel Telemetry Plate -->
    <div class="panel title-plate">
      <div class="title-row">
        <span class="vessel-tag">CTSC</span>
        <span class="title-main" id="vessel-title">极地破冰航行</span>
      </div>
      <div class="telemetry-grid">
        <div class="stat">
          <span class="stat-label" id="label-speed">航速</span>
          <span class="stat-value" id="stat-speed">5.3 节</span>
        </div>
        <div class="stat">
          <span class="stat-label" id="label-heading">航向</span>
          <span class="stat-value" id="stat-heading">225°</span>
        </div>
        <div class="stat">
          <span class="stat-label" id="label-engine">主机</span>
          <span class="stat-value" id="stat-throttle">进车 42%</span>
        </div>
      </div>
      <div class="throttle-track">
        <div class="throttle-fill" id="throttle-fill"></div>
      </div>
    </div>

    <!-- Top-right Minimal Actions & Language Switcher (ZH / EN / PT) -->
    <div class="top-actions">
      <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="zh" title="中文">中</button>
        <button type="button" class="lang-btn" data-lang="en" title="English">EN</button>
        <button type="button" class="lang-btn" data-lang="pt" title="Português">PT</button>
      </div>
      <button type="button" class="icon-btn" id="btn-reset" title="重置航线与冰原">
        <kbd>R</kbd><span id="label-reset">重置航线</span>
      </button>
      <button type="button" class="icon-btn" id="btn-hide-hud" title="切换纯净插画视图">
        <kbd>H</kbd><span id="label-clean-view">纯净视图</span>
      </button>
    </div>

    <!-- Bottom-left WASD Helm Controls -->
    <div class="panel helm-panel">
      <div class="wasd-grid">
        <button type="button" class="keycap key-w" data-key="KeyW">W</button>
        <button type="button" class="keycap key-a" data-key="KeyA">A</button>
        <button type="button" class="keycap key-s" data-key="KeyS">S</button>
        <button type="button" class="keycap key-d" data-key="KeyD">D</button>
      </div>
      <div class="helm-hints">
        <div id="hint-throttle"><strong>W / S</strong> 进车 / 倒车</div>
        <div id="hint-rudder"><strong>A / D</strong> 左舵 / 右舵转向</div>
        <button type="button" class="keycap space-btn" id="btn-space-stop" data-key="Space">SPACE 停机</button>
      </div>
    </div>

    <!-- Bottom-center Fixed Camera Lenses -->
    <div class="lens-dock">
      <div class="lens-desc" id="lens-desc"></div>
      <div class="panel lens-bar" id="lens-bar"></div>
    </div>
  </div>

  <button type="button" class="icon-btn" id="btn-show-hud" title="恢复界面">
    <kbd>H</kbd><span id="label-show-hud">显示界面</span>
  </button>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
